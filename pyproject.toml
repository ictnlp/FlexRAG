[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "flexrag"
description = "Flexible RAG (Retrieval-Augmented Generation) framework for building AI applications."
authors = [{ name = "Zhang Zhuocheng", email = "zhuocheng_zhang@outlook.com" }]
license = { text = "MIT License" }
readme = "README.md"
urls = { "Homepage" = "https://github.com/ictnlp/flexrag", "Documentation" = "https://flexrag.readthedocs.io/en/latest/", "Source" = "https://github.com/ictnlp/flexrag" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]
dependencies = [
    # general
    "numpy",
    "tenacity",
    "hydra-core>=1.3",
    "omegaconf>=2.3.0",
    "pillow",
    "colorama",
    "PyYAML",
    "pydantic",
    "requests",
    "rich",
    "tqdm",
    "torch>=2.9.0",
    "pandas",
    "sentencepiece",
    "orjson",
    "huggingface-hub",
    # metrics
    "rouge-score",
    "sacrebleu>=2.4.2",
    "pytrec_eval>=0.5",
    # datasets
    "datasets>=3.2.0",
    # models
    "litellm>=1.80,<2,!=1.82.7,!=1.82.8",
    "sentence_transformers",
    "transformers>=4.52.3",
    "accelerate",
    # databases
    "lmdb",
    "msgpack",
    # processors
    "unidecode",
    "sacremoses",
    "opencc",
    "jieba",
    # retrievers
    "PyStemmer",
    "bm25s",
    "elasticsearch>=8.14.0",
    "typesense",
    "httpx",
    "scann>=1.4.0",
    # chunking
    "regex",
    "nltk",
    "tiktoken",
]

[project.optional-dependencies]
ui = ["gradio>=6.1.0"]
web = [
    "beautifulsoup4",
    "duckduckgo_search",
    "serpapi",
    "playwright",
]
doc-parsers = ["markitdown", "docling"]
dev = [
    "black",
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "sphinx",
    "sphinx-autobuild",
    "sphinx-book-theme",
    "sphinx-copybutton",
    "sphinx-intl",
    "myst-parser",
    "rstcheck",
    "doc8",
    "PySocks>=1.7.1",
    "pre-commit",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/flexrag/common/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/flexrag"]

[tool.rstcheck]
ignore_directives = ["autoclass", "automodule", "autofunction", "autosummary"]

[tool.doc8]
ignore = ["D001"]

[tool.pytest.ini_options]
markers = ["gpu: mark test as requiring GPU"]
log_level = "DEBUG"
asyncio_default_fixture_loop_scope = "function"

[tool.ty.rules]
invalid-return-type = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
unresolved-attribute = "ignore"
call-non-callable = "ignore"
invalid-method-override = "ignore"
